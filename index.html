<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyric Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="suggestion-widget" id="suggestionWidget">
        <button id="suggestionToggle" class="suggestion-toggle">💡</button>
        <div id="suggestionPanel" class="suggestion-panel hidden">
            <div class="suggestion-title">Suggest a song</div>
            <input type="text" id="suggestionInput" class="suggestion-input" placeholder="Song — Artist">
            <button id="suggestionSubmit" class="suggestion-submit">Submit</button>
            <div id="suggestionMsg" class="suggestion-msg"></div>
        </div>
    </div>

    <header class="hero">
        <h1 class="hero-title">Lyric Box</h1>
        <p class="hero-subtitle">Pick a song. Get a reaction.</p>

        <input
            type="text"
            id="searchInput"
            class="search-bar"
            placeholder="🔍 Search for a song..."
        >
    </header>

    <main class="song-grid" id="songList">
        <div class="no-results">Loading songs...</div>
    </main>

    <div id="popupOverlay" class="popup-overlay hidden">
        <div class="retro-window" id="retroWindow">
            <div class="retro-titlebar" id="retroTitlebar">
                <span id="popupWindowTitle">Now Vibing</span>
                <button id="popupClose" class="retro-close">✕</button>
            </div>
            <div class="retro-body">
                <div class="retro-row">
                    <div class="popup-sticker-wrap">
                        <img id="popupStickerImg" class="popup-sticker-gif hidden" src="" alt="sticker">
                    </div>
                    <div class="popup-text">
                        <div id="popupSongTitle" class="popup-song-title">Song Name</div>
                        <div id="popupSongArtist" class="popup-song-artist">Artist</div>
                    </div>
                </div>

                <div class="section-label">Lyrics</div>
                <div id="popupLyrics" class="popup-lyrics-box">Loading lyrics...</div>

                <div class="section-label">About the artist</div>
                <div id="popupArtistInfo" class="popup-artist-box">Loading info...</div>

                <button id="popupOk" class="retro-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
